name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests-js:
    name: tests.js — unit + adapter e2e + edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run scripts/test.js
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: node scripts/test.js

  dev-test:
    name: dev-test.mjs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run tests/dev-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: npx tsx tests/dev-test.mjs

  prod-hydration:
    name: production-hydration-test.mjs — prod hydration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Run tests/production-hydration-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: node tests/production-hydration-test.mjs

  dev-hydration:
    name: hydration-test.mjs — dev hydration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        id: setup
      - name: Start dev server (scripts/e2e-setup.js) and run tests/hydration-test.mjs
        env:
          CHROMIUM_PATH: ${{ steps.setup.outputs.chrome-path }}
        run: |
          setsid nohup npx tsx scripts/e2e-setup.js > /tmp/e2e.log 2>&1 < /dev/null &
          for i in $(seq 1 180); do
            grep -q E2E_SERVERS_READY /tmp/e2e.log && break
            sleep 1
          done
          grep -q E2E_SERVERS_READY /tmp/e2e.log || { echo "e2e-setup failed to start"; cat /tmp/e2e.log; exit 1; }
          BASE=http://localhost:3002 node tests/hydration-test.mjs
          RC=$?
          pkill -f e2e-setup.js 2>/dev/null || true
          exit $RC

  publish:
    name: Publish to npm + GitHub tag & release
    needs: [tests-js, dev-test, prod-hydration, dev-hydration]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Skip if no packages/ files changed on this push
        id: changed
        run: |
          BASE="${{ github.event.before }}"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"; fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^packages/'; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "packages changed — publishing"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "no packages/** changes — skipping publish"
          fi

      - name: Bump versions, build all packages, publish to npm
        if: steps.changed.outputs.changed == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs "$(node scripts/next-version.mjs)"

      - name: Commit version bumps, create tag, prepare notes
        if: steps.changed.outputs.changed == 'yes'
        id: tag
        run: |
          VERSION="$(node -e "console.log(require('./packages/types/package.json').version)")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/create-vesk/src/index.js
          git diff --cached --quiet || git commit -m "release: v$VERSION [skip ci]"
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v$VERSION"
          {
            echo "## Changes in v$VERSION"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --oneline "$PREV_TAG..HEAD~1"
            else
              git log --oneline -20 HEAD~1
            fi
            echo ""
            echo "**npm:** all vesk packages published at \`$VERSION\`"
          } > release-notes.md

      - name: Create GitHub release
        if: steps.changed.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -e "console.log(require('./packages/types/package.json').version)")"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --verify-tag